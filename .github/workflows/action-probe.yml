name: action-probe

# 验证 GitHub Actions 侧：
# 1) 声明 using: node24 的 JS action 是否真的以 Node 24 执行
# 2) upload-sarif-action 端到端是否跑通（OIDC 换证 + OBS 上传 + 回调）
on:
  workflow_dispatch:
  push:
    branches: [probe-action-run]

permissions:
  contents: read
  id-token: write

jobs:
  node24-probe:
    name: node24 runtime probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host node info
        run: |
          uname -a
          which node || true
          node -v || true

      - name: Run node24 local action
        uses: ./.github/actions/node-probe

  upload-sarif:
    name: upload-sarif-action end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查 gitleaks 版本
        run: |
          chmod +x .github/bin/gitleaks
          .github/bin/gitleaks version

      - name: 运行 Gitleaks 扫描
        run: |
          mkdir -p sarif
          .github/bin/gitleaks dir . --config .gitleaks.toml --verbose \
            --report-format sarif \
            --report-path sarif/gitleaks.sarif \
            || echo "gitleaks found leaks, continuing to upload SARIF"

      - name: Upload SARIF to openLiBing
        if: ${{ always() }}
        uses: openlibing-test/upload-sarif-action@source-platform-detection
        with:
          sarif_file: sarif/gitleaks.sarif
          source_path: .
          category: action-probe
          env_type: beta

  # 用 GitCode 主线（含双平台适配 + node24 声明）的同一份构建产物，
  # 以本地 action 形式在 GitHub 上执行，验证“一套代码两端可用”
  upload-sarif-gitcode-dual:
    name: upload-sarif (gitcode build) end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 运行 Gitleaks 扫描
        run: |
          chmod +x .github/bin/gitleaks
          mkdir -p sarif-dual
          .github/bin/gitleaks dir . --config .gitleaks.toml --verbose \
            --report-format sarif \
            --report-path sarif-dual/gitleaks.sarif \
            || echo "gitleaks found leaks, continuing to upload SARIF"

      - name: Upload SARIF via GitCode build
        if: ${{ always() }}
        uses: ./.github/actions/upload-sarif-gh
        with:
          sarif_file: sarif-dual/gitleaks.sarif
          source_path: .
          category: action-probe-gitcode-build
          env_type: beta
