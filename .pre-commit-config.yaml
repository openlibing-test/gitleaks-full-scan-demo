# 使用仓库内自带的 gitleaks 二进制（linux x64 v8.30.1），不依赖网络与 Go 环境
# language: system 表示 pre-commit 不安装/编译任何依赖，直接执行 entry
# 注意：官方 gitleaks 仓库的钩子默认 `gitleaks git --staged`，只扫暂存区，
#      CI 干净检出场景下等于空转；此处显式使用 `dir .` 全量扫描工作目录
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (full working tree)
        entry: ./.github/bin/gitleaks dir . --config .gitleaks.toml --no-banner --report-format sarif --report-path gitleaks.sarif
        language: system
        pass_filenames: false
        always_run: true
